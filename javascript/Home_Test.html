<html>
  <head>
    <meta charset="utf-8" />
    <script type="text/javascript">
      // 1. 사용자에게 입력받기
      var name = prompt("이름 입력:");
      var birthYear = prompt("태어난 연도 입력");

      // 2. 계산하기 (prompt로 받은 글자를 숫자로 변환)
      var age = 2026 - birthYear;

      // 3. 계산 알림창
      alert(name + "님의 나이는 " + age + "세입니다");
      console.log("이름: " + name, "나이: " + age);

    </script>
  </head>
</html>
